<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recon Chain · Multi‑Scan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f6f8fa;
      color: #1e2b34;
      transition: background 0.25s ease, color 0.2s ease;
    }

    body.dark {
      background: #161c1e;
      color: #dce6e2;
    }

    ::selection {
      background: #ffb00055;
      color: #0b1210;
    }

    #root {
      min-height: 100vh;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cdd9d4;
      border-radius: 20px;
    }
    body.dark ::-webkit-scrollbar-thumb {
      background: #364a44;
    }

    .app {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 100vh;
      transition: background 0.2s;
    }
    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }
    }

    .sidebar {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-right: 1px solid rgba(0, 0, 0, 0.06);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      overflow-y: auto;
      max-height: 100vh;
      transition: background 0.2s, border-color 0.2s;
    }
    body.dark .sidebar {
      background: rgba(26, 34, 36, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-right: 1px solid rgba(255, 255, 255, 0.04);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .brand-mark {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffb000, #f57c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #6b7f78;
    }
    body.dark .brand-sub {
      color: #8fa39b;
    }

    .theme-toggle {
      margin-left: auto;
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 40px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      transition: 0.15s;
    }
    body.dark .theme-toggle {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.08);
    }
    .theme-toggle span {
      font-size: 14px;
      font-weight: 500;
      color: #1e2b34;
    }
    body.dark .theme-toggle span {
      color: #cdd9d4;
    }

    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #5f7470;
      margin-bottom: 5px;
    }
    body.dark .field label {
      color: #8fa39b;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      background: #ffffff;
      border: 1px solid #dbe3e0;
      color: #1e2b34;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: 0.15s;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }
    body.dark input[type="text"],
    body.dark input[type="password"],
    body.dark select {
      background: #1e282b;
      border-color: #2f3f3f;
      color: #dce6e2;
    }
    input:focus,
    select:focus {
      outline: none;
      border-color: #ffb000;
      box-shadow: 0 0 0 3px #ffb00033;
    }

    .scope-tabs {
      display: flex;
      gap: 6px;
      background: #f0f4f2;
      border-radius: 16px;
      padding: 4px;
    }
    body.dark .scope-tabs {
      background: #1e282b;
    }
    .scope-tab {
      flex: 1;
      text-align: center;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      color: #5f7470;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.15s;
    }
    body.dark .scope-tab {
      color: #8fa39b;
    }
    .scope-tab.active {
      background: #ffb000;
      color: #0b1210;
      box-shadow: 0 2px 6px #ffb00044;
    }
    body.dark .scope-tab.active {
      background: #ffb000;
      color: #0b1210;
    }

    .chain {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .chain-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #5f7470;
      margin-bottom: 12px;
    }
    body.dark .chain-title {
      color: #8fa39b;
    }
    .chain-node {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.15s;
      background: transparent;
    }
    .chain-node:hover {
      background: rgba(0, 0, 0, 0.03);
    }
    body.dark .chain-node:hover {
      background: rgba(255, 255, 255, 0.04);
    }
    .chain-node.disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .chain-node.disabled:hover {
      background: transparent;
    }
    .chain-link {
      width: 2px;
      height: 18px;
      margin-left: 18px;
      background: #dbe3e0;
      transition: 0.2s;
    }
    body.dark .chain-link {
      background: #2f3f3f;
    }
    .chain-link.active {
      background: #ffb000;
    }
    .chain-dot {
      width: 14px;
      height: 14px;
      border-radius: 40px;
      border: 2px solid #dbe3e0;
      background: #f0f4f2;
      transition: 0.2s;
      flex-shrink: 0;
    }
    body.dark .chain-dot {
      border-color: #2f3f3f;
      background: #1e282b;
    }
    .chain-node.on .chain-dot {
      border-color: #ffb000;
      background: #ffb000;
      box-shadow: 0 0 10px #ffb00066;
    }
    .chain-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 450;
    }
    .chain-hint {
      font-size: 10px;
      color: #7c8f89;
      margin-left: auto;
      background: rgba(0, 0, 0, 0.03);
      padding: 2px 10px;
      border-radius: 30px;
    }
    body.dark .chain-hint {
      background: rgba(255, 255, 255, 0.04);
      color: #8fa39b;
    }

    .btn {
      background: #ffb000;
      color: #0b1210;
      border: none;
      padding: 12px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 8px #ffb00033;
      letter-spacing: 0.2px;
    }
    .btn:hover {
      background: #ffc433;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px #ffb00055;
    }
    .btn:disabled {
      background: #dbe3e0;
      color: #7c8f89;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
    }
    body.dark .btn:disabled {
      background: #2f3f3f;
      color: #5f7470;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid #dbe3e0;
      color: #5f7470;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.1s;
    }
    body.dark .btn-ghost {
      border-color: #2f3f3f;
      color: #8fa39b;
    }
    .btn-ghost:hover {
      background: rgba(0, 0, 0, 0.06);
      border-color: #8fae9d;
      color: #2f5147;
    }
    .btn-ghost:active {
      transform: scale(0.96);
      background: rgba(0, 0, 0, 0.1);
    }
    body.dark .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: #6b8a80;
      color: #d4e6df;
    }
    body.dark .btn-ghost:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-danger {
      background: #ff6b5d;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-danger:hover {
      background: #ff4433;
    }
    .btn-success {
      background: #2dd4a7;
      color: #0b1210;
      border: none;
      border-radius: 40px;
      padding: 6px 16px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-success:hover {
      opacity: 0.8;
    }

    .history-panel {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(0, 0, 0, 0.04);
      border-radius: 20px;
      padding: 8px 10px;
      max-height: 220px;
      overflow-y: auto;
    }
    body.dark .history-panel {
      background: rgba(30, 40, 43, 0.7);
      border-color: rgba(255, 255, 255, 0.04);
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.1s;
    }
    .history-item:hover {
      background: rgba(0, 0, 0, 0.03);
    }
    body.dark .history-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }
    .history-item .target {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
    }
    .history-item .meta {
      font-size: 10px;
      color: #7c8f89;
    }
    .history-item .status {
      font-size: 10px;
      padding: 2px 10px;
      border-radius: 40px;
      font-weight: 500;
      background: rgba(0, 0, 0, 0.04);
    }
    body.dark .history-item .status {
      background: rgba(255, 255, 255, 0.06);
    }
    .history-item .status.completed {
      color: #2dd4a7;
    }
    .history-item .status.running {
      color: #ffb000;
    }
    .history-item .status.failed {
      color: #ff6b5d;
    }

    .main {
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      overflow-y: auto;
      max-height: 100vh;
      background: #ffffff;
      transition: background 0.2s;
    }
    body.dark .main {
      background: #161c1e;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .status-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 5px 16px;
      border-radius: 40px;
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid #dbe3e0;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    body.dark .status-pill {
      background: rgba(255, 255, 255, 0.04);
      border-color: #2f3f3f;
    }
    .status-pill.completed {
      color: #2dd4a7;
      border-color: #2dd4a7;
    }
    .status-pill.running {
      color: #ffb000;
      border-color: #ffb000;
      animation: pulse 1.5s infinite;
    }
    .status-pill.failed {
      color: #ff6b5d;
      border-color: #ff6b5d;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
    }

    .summary-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .summary-chip {
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid #eef3f0;
      border-radius: 40px;
      padding: 6px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }
    body.dark .summary-chip {
      background: rgba(255, 255, 255, 0.03);
      border-color: #263537;
    }
    .summary-chip b {
      color: #ffb000;
      font-size: 15px;
      margin-right: 6px;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid #eef3f0;
      padding: 12px 16px;
      border-radius: 30px;
      transition: 0.2s;
    }
    body.dark .filter-bar {
      background: rgba(255, 255, 255, 0.02);
      border-color: #263537;
    }
    .filter-bar input,
    .filter-bar select {
      width: auto;
      min-width: 100px;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 40px;
      background: #ffffff;
      border: 1px solid #dbe3e0;
      color: #1e2b34;
    }
    body.dark .filter-bar input,
    body.dark .filter-bar select {
      background: #1e282b;
      border-color: #2f3f3f;
      color: #dce6e2;
    }
    .filter-bar .sep {
      width: 1px;
      height: 28px;
      background: #dbe3e0;
    }
    body.dark .filter-bar .sep {
      background: #2f3f3f;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 6px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
    }
    thead th {
      text-align: left;
      padding: 8px 12px;
      color: #5f7470;
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    body.dark thead th {
      color: #8fa39b;
    }
    tbody td {
      padding: 12px 12px;
      background: rgba(0, 0, 0, 0.01);
      border-radius: 16px;
      vertical-align: middle;
    }
    body.dark tbody td {
      background: rgba(255, 255, 255, 0.02);
    }
    tbody tr {

    }
    tbody tr:hover td {
      background: rgba(0, 0, 0, 0.03);
    }
    body.dark tbody tr:hover td {
      background: rgba(255, 255, 255, 0.04);
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 30px;

      font-weight: 500;
      border: 1px solid #eef3f0;

      background: #ffffff;

    body.dark .badge {
      border-color: #263537;

    }
    .badge.type-http_service {

    }
    .badge.type-subdomain {
      color: #ffb000;
      border-color: #ffb000;
    }
    .badge.type-open_port {
      color: #ff9d5c;
      border-color: #ff9d5c;
    }
    .badge.type-js_file {
      color: #c792ea;
      border-color: #c792ea;
    }
    .badge.type-url {
      color: #64b5f6;
      border-color: #64b5f6;
    }
    .badge.type-directory {
      color: #ba68c8;
      border-color: #ba68c8;
    }
    .badge.type-finding {
      color: #ffb74d;
      border-color: #ffb74d;
    }
    .badge.type-device {
      color: #66d9c4;
      border-color: #66d9c4;
    }
    .badge.sev-high {
      background: #ff6b5d;
      color: #0b1210;
      border-color: #ff6b5d;
    }
    .badge.sev-medium {
      background: #ffb000;
      color: #0b1210;
      border-color: #ffb000;
    }

    .code-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      word-break: break-all;
    }
    .muted {
      color: #7c8f89;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #7c8f89;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    .selection-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid #eef3f0;
      border-radius: 40px;
    }
    body.dark .selection-bar {
      background: rgba(255, 255, 255, 0.02);
      border-color: #263537;

    .selection-bar .count {

      font-size: 12px;
      color: #5f7470;
    }
    .selection-bar .sep {

    body.dark .selection-bar .sep {

    }

    .modal-overlay {

      inset: 0;

      -webkit-backdrop-filter: blur(8px);

      padding: 20px;
    }
    .modal-content {

      max-height: 90%;

    body.dark .modal-content {

    .modal-content img {

      max-height: 70vh;

      top: -12px;

      border-radius: 50%;

      height: 34px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(255, 107, 93, 0.3);

    .modal-close:hover {

    }

    .theme-switch {

      gap: 8px;
      margin-left: auto;
    }
    .theme-switch .label {
      font-size: 12px;
      font-weight: 500;
      color: #5f7470;
    }
    body.dark .theme-switch .label {
      color: #8fa39b;
    }
    .toggle-track {
      width: 44px;
      height: 24px;
      background: #dbe3e0;
      border-radius: 40px;
      position: relative;
      cursor: pointer;
      transition: 0.2s;
    }
    body.dark .toggle-track {
      background: #2f3f3f;
    }
    .toggle-track .thumb {
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 40px;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: 0.2s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    body.dark .toggle-track .thumb {
      left: 22px;
      background: #ffb000;
    }

    .btn-success.small {
      font-size: 11px;
      padding: 4px 14px;
    }

<body>
  <div id="root"></div>
  <script>
    window.RECON_API_BASE = window.RECON_API_BASE ||
      (window.location.protocol + "//" + window.location.hostname + ":8000");
    const API = window.RECON_API_BASE;
    // API key removed — all requests go without Authorization header

    async function apiFetch(url, options = {}) {
      return fetch(url, { ...options });
    }

    const STAGES = [
      { id: "subdomain_enum", label: "subdomain_enum", hint: "wildcard only" },
      { id: "url_collect", label: "url_collect", hint: "passive" },
      { id: "katana_crawl", label: "katana_crawl", hint: "active" },
      { id: "dir_fuzz", label: "dir_fuzz", hint: "ffuf/feroxbuster" },
      { id: "device_scan", label: "device_scan", hint: "cidr only" },
      { id: "port_scan", label: "port_scan", hint: "port + nmap" },
      { id: "http_probe", label: "http_probe", hint: "" },
      { id: "screenshot", label: "screenshot", hint: "needs playwright" },
    ];

    const SCOPE_MODES = [
      { id: "wildcard", label: "Wildcard" },
      { id: "cidr", label: "CIDR" },
    ];

    const truncateTarget = (target) => {
      if (!target) return '';
      const parts = target.split(',').map(p => p.trim()).filter(Boolean);
      if (parts.length === 0) return '';
      const first = parts[0];
      const shortFirst = first.length > 28 ? first.slice(0, 28) + '…' : first;
      if (parts.length === 1) return shortFirst;
      return `${shortFirst} +${parts.length - 1}`;
    };

    
    const { useState, useEffect, useRef } = React;

    
    function StageChain({ enabled, scopeMode, onToggle }) {

    function App() {
      const [darkMode, setDarkMode] = useState(() => {
        if (typeof window !== 'undefined') {
          const stored = localStorage.getItem('recon_dark_mode');
          if (stored !== null) return stored === 'true';
          return window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        return false;
      });

      useEffect(() => {
        document.body.classList.toggle('dark', darkMode);
        localStorage.setItem('recon_dark_mode', JSON.stringify(darkMode));
      }, [darkMode]);

      const [config, setConfig] = useState({
        target: "",
        scope_mode: "wildcard",
        enabled_stages: ["subdomain_enum", "http_probe"],
        wordlist_id: null,
        wordlistName: null,
      });

      const [scans, setScans] = useState([]);
      const [activeScanId, setActiveScanId] = useState(null);
      const [history, setHistory] = useState([]);
      const [running, setRunning] = useState(false);
      const [screenshotAsset, setScreenshotAsset] = useState(null);
      const [filters, setFilters] = useState({ type: "", search: "", status_code: "", tech: "" });
      const [selectedAssets, setSelectedAssets] = useState(new Set());

      const filtersRef = useRef(filters);
      useEffect(() => { filtersRef.current = filters; }, [filters]);

      useEffect(() => { fetchHistory(); }, []);

      useEffect(() => {
        if (!activeScanId) return;
        const handle = setTimeout(() => { fetchScanData(activeScanId); }, 300);
        return () => clearTimeout(handle);
      }, [activeScanId, filters.type, filters.search, filters.status_code, filters.tech]);

      const fetchHistory = async () => {
        try {
          const res = await apiFetch(`${API}/scans`);
          if (res.ok) { const data = await res.json();
            setHistory(data); }
        } catch (e) { console.error('Failed to load history:', e); }
      };

      const fetchScanData = async (scanId) => {
        try {
          const res = await apiFetch(`${API}/scans/${scanId}`);
          const data = await res.json();
          const s = await apiFetch(`${API}/scans/${scanId}/summary`);
          const summary = await s.json();
          const currentFilters = filtersRef.current;
          const params = new URLSearchParams();
          Object.entries(currentFilters).forEach(([k, v]) => { if (v) params.set(k, v); });
          const a = await apiFetch(`${API}/scans/${scanId}/assets?${params.toString()}`);
          let assets = await a.json();
          // dedupe
          const seen = new Set();
          assets = assets.filter(a => {
            const key = `${a.type}:${a.value}`;
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          });
          setScans(prev => prev.map(item =>
            item.id === scanId ? { ...item, scan: data, summary, assets, status: data.status, running: data.status === "running" } : item
          ));
          if (data.status === "completed" || data.status === "failed") {
            setScans(prev => prev.map(item => item.id === scanId ? { ...item, running: false } : item));
            fetchHistory();
          }
        } catch (e) { console.error('Failed to load scan:', e); }
      };

      const loadHistory = (historyItem) => {
        setConfig(c => ({ ...c, target: historyItem.target }));
        setActiveScanId(historyItem.id);
        setScans(prev => {
          const existing = prev.find(s => s.id === historyItem.id);
          if (existing) return prev;
          return [...prev, {
            id: historyItem.id,
            target: historyItem.target,
            name: historyItem.name || historyItem.target,
            status: historyItem.status,
            scan: historyItem,
            assets: [],
            summary: null,
            running: historyItem.status === "running",
          }];
        });
        fetchScanData(historyItem.id);
      };

      const clearHistory = async () => {
        if (!confirm('Clear all FINISHED scan history? Running/queued scans are kept.')) return;
        try {
          const res = await apiFetch(`${API}/scans`, { method: 'DELETE' });
          if (!res.ok) throw new Error(await res.text());
          const result = await res.json();
          setScans(prev => prev.filter(s => s.status === 'running' || s.status === 'queued'));
          setActiveScanId(prev => {
            const stillThere = scans.find(s => s.id === prev && (s.status === 'running' || s.status === 'queued'));
            return stillThere ? prev : null;
          });
          await fetchHistory();
          if (result.skipped_running > 0) {
            alert(`Cleared ${result.deleted} scan(s). ${result.skipped_running} running/queued scan(s) kept.`);
          }
        } catch (e) { alert('Failed to clear history: ' + e.message); }
      };

      const run = async (overrides = {}) => {
        const target = overrides.target !== undefined ? overrides.target : config.target;
        const name = overrides.name !== undefined ? overrides.name : (truncateTarget(target) || target);
        if (!target) return;
        setRunning(true);
        const payload = {
          name,
          target,
          scope_mode: config.scope_mode,
          enabled_stages: config.enabled_stages,
          wordlist_id: config.wordlist_id || null,
        };
        try {
          const res = await apiFetch(`${API}/scans`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          const newScan = {
            id: data.id,
            target: data.target,
            name: data.name || data.target,
            status: data.status,
            scan: data,
            assets: [],
            summary: null,
            running: true,
          };
          setScans(prev => [...prev, newScan]);
          setActiveScanId(data.id);
          fetchHistory();
          setRunning(false);
          const pollInterval = setInterval(() => {
            setScans(prev => {
              const currentScan = prev.find(s => s.id === data.id);
              if (currentScan && (currentScan.status === "completed" || currentScan.status === "failed")) {
                clearInterval(pollInterval);
              }
              return prev;
            });
            fetchScanData(data.id);
          }, 1000);
        } catch (e) {
          alert("Could not reach the API at " + API + ". Is the backend running?");
          setRunning(false);
        }
      };

      const stopScan = async (scanId) => {
        if (!confirm('Stop this scan? Data collected will be preserved.')) return;
        try {
          const res = await apiFetch(`${API}/scans/${scanId}/stop`, { method: "POST" });
          if (res.ok) {
            setScans(prev => prev.map(s => s.id === scanId ? { ...s, status: 'failed', running: false } : s));
            fetchHistory();
            setTimeout(() => fetchScanData(scanId), 500);
          } else {
            const err = await res.text();
            alert(`Failed to stop scan: ${err}`);
          }
        } catch (e) { console.error('Error stopping scan:', e); }
      };

      const exportJSON = (assets, scan) => {
        if (assets.length === 0) return alert('No assets to export');
        const data = {
          scan: scan ? { id: scan.id, target: scan.target, status: scan.status, created_at: scan.created_at } : null,
          assets: assets,
          exported_at: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `recon_assets_${scan?.target || 'export'}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const exportCSV = (assets, scan) => {
        if (assets.length === 0) return alert('No assets to export');
        const headers = ['Type', 'Value', 'Source', 'Port', 'IP', 'Service', 'Status Code', 'Title', 'Tech', 'Severity'];
        const rows = assets.map(a => [
          a.type,
          a.value,
          a.source || 'unknown',
          a.meta?.port || '',
          a.meta?.ip || '',
          a.meta?.service || '',
          a.meta?.status_code || '',
          a.meta?.title || '',
          (a.meta?.tech || []).join('; '),
          a.meta?.severity || ''
        ]);
        const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `recon_assets_${scan?.target || 'export'}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const activeScan = scans.find(s => s.id === activeScanId);
      const activeAssets = activeScan?.assets || [];
      const activeSummary = activeScan?.summary;
      const activeScanData = activeScan?.scan;

      const toggleSelect = (id) => {
        const newSelected = new Set(selectedAssets);
        if (newSelected.has(id)) newSelected.delete(id);
        else newSelected.add(id);
        setSelectedAssets(newSelected);
      };

      const toggleSelectAll = () => {
        if (selectedAssets.size === activeAssets.length && activeAssets.length > 0) {
          setSelectedAssets(new Set());
        } else {
          const all = new Set(activeAssets.map(a => a.id));
          setSelectedAssets(all);
        }
      };

      const runOnSelected = () => {
        if (selectedAssets.size === 0) return alert('Select assets first');
        const values = Array.from(selectedAssets)
          .map(id => activeAssets.find(a => a.id === id))
          .filter(Boolean)
          .map(a => a.value);
        const urls = Array.from(new Set(values));
        const target = urls.join(', ');
        const name = urls.length === 1 ?
          (urls[0].length > 28 ? urls[0].slice(0, 28) + '…' : urls[0]) :
          `${urls[0].length > 20 ? urls[0].slice(0, 20) + '…' : urls[0]} +${urls.length - 1}`;
        setConfig(c => ({ ...c, target }));
        run({ target, name });
        setSelectedAssets(new Set());
      };

            React.createElement(

                React.createElement("th", { style: { width: '40px' } },
